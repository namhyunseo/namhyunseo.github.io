---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%Y년 %m월 %d일" }}
      {%- if page.author %} · {{ page.author }}{%- endif %}
    </p>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {%- if page.doc %}
  <div style="margin-top: 2rem;">
    <a href="/docs/{{ page.doc }}.html"
       target="_blank"
       style="display:inline-block; margin-bottom: 1rem; padding: 6px 14px;
              background: #e8f0fe; border-radius: 6px; font-size: 0.9em;
              text-decoration: none; color: #1a73e8;">
      ↗ 전체 문서 열기
    </a>
    <iframe
      src="/docs/{{ page.doc }}.html"
      style="width:100%; height:80vh; border:1px solid #e0e0e0; border-radius:8px;"
      loading="lazy"
      title="{{ page.title }}">
    </iframe>
  </div>
  {%- endif %}
</article>
