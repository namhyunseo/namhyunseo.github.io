---
layout: default
---
<article class="entry">
  <p class="page-head__kicker">TIL</p>
  <h1 class="entry__heading">{{ page.title | escape }}</h1>
  <p class="entry__meta">
    <time>{{ page.date | date: "%Y.%m.%d" }}</time>
    {%- if page.tags and page.tags.size > 0 %}
    {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    {%- endif %}
  </p>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="entry__foot">
    <a href="/til/">&larr; TIL 목록</a>
  </footer>
</article>
